server.address=127.0.0.1
server.port=0
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
spring.datasource.url=jdbc:sqlite:${databridge.data-dir}/application.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
logging.level.root=INFO
logging.file.name=${databridge.data-dir}/logs/databridge-${databridge.instance:tests}.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=3
